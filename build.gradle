plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '2.0.1'
group = 'cn.blockforge.generated.adaptivesoundscape'
base { archivesName = 'z80z-adaptive-soundscape' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                adaptive_soundscape {
                    source sourceSets.main
                }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation 'javazoom:jlayer:1.0.1'
    jarJar(implementation('javazoom:jlayer:1.0.1')) {
        jarJar.ranged(it, '[1.0.1,2.0)')
    }
    implementation 'com.tianscar.javasound:javasound-flac:1.4.1'
    jarJar(implementation('com.tianscar.javasound:javasound-flac:1.4.1')) {
        jarJar.ranged(it, '[1.4.1,2.0)')
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'z80z_adaptive_soundscape', mod_name: 'Z80Z Adaptive Soundscape',
                 mod_version: project.version, minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
build.dependsOn 'jarJar'
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
